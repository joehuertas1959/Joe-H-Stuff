<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<!-- Generated from dashboard.html by build.mjs. Edit dashboard.html, then rebuild. -->
<title>Joe H Bridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky left rail (Work/Personal switch + angled nav blocks) beside a main deck of framed panels.
   Single deliberate dark look from the Bridge OS v2 handoff (Nocturne tokens + v2 additions). */
:root{
  color-scheme:dark;
  --bg:#161826; --surface:#232532; --text:#e9e9ed;
  --n100:#f3f5fe; --n200:#e4e7f5; --n300:#cfd3e5; --n400:#b2b6ca; --n500:#9397ab;
  --n600:#75798c; --n700:#595d6c; --n800:#3f424d; --n900:#292b31;
  --amber2:oklch(0.80 0.13 70); --peach:oklch(0.80 0.09 40); --lilac:oklch(0.76 0.09 310);
  --sky:oklch(0.78 0.08 235); --red:oklch(0.70 0.17 25); --amber:oklch(0.82 0.13 80); --green:oklch(0.78 0.12 165);
  --hud:#9184d9;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",var(--font-body);
  --pad:16px; --gap:14px;
}
:root[data-space="personal"]{--hud:#73d1b2}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--hud);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--hud) 30%,transparent)}
a{color:color-mix(in srgb,var(--hud) 70%,var(--n100))}
svg.i{width:1em;height:1em;flex:none;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{position:relative;min-height:100vh;display:flex;
  background:radial-gradient(1100px 520px at 75% -8%,color-mix(in srgb,var(--hud) 14%,transparent),transparent 65%),
             radial-gradient(800px 500px at -10% 110%,color-mix(in srgb,var(--hud) 8%,transparent),transparent 60%)}
.grid-fx{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(color-mix(in srgb,var(--hud) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--hud) 6%,transparent) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 60% 30%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 60% 30%,#000 25%,transparent 80%)}

/* — rail — */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;width:232px;flex:none;display:flex;flex-direction:column;gap:18px;
  padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));
  border-right:1px solid color-mix(in srgb,var(--hud) 18%,var(--n900));background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(8px);z-index:2;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:32px;height:32px;border-radius:50%;border:1px solid var(--hud);display:grid;place-items:center;color:var(--hud);font-size:18px;
  box-shadow:0 0 16px color-mix(in srgb,var(--hud) 45%,transparent)}
.brand-name{display:flex;flex-direction:column;line-height:1.2}
.brand-name b{font-size:14px;font-weight:600;letter-spacing:.16em}
.brand-name b span{color:var(--hud)}
.brand-name small{font-size:9.5px;letter-spacing:.16em;color:var(--n500)}
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border:1px solid var(--n800);border-radius:3px}
.spaces button{font-size:12px;padding:7px 0;border:0;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;color:var(--n400)}
.spaces button[aria-pressed="true"]{background:var(--hud);color:var(--bg);font-weight:600}
.spaces button:not([aria-pressed="true"]):hover{color:var(--n100);background:color-mix(in srgb,var(--text) 7%,transparent)}
.switch-hint{font-size:10.5px;color:var(--n500);text-align:center;margin-top:-12px}
.switch-hint kbd{font:inherit;border:1px solid var(--n700);border-radius:4px;padding:0 5px;color:var(--n300)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;min-height:46px;padding:5px 10px 6px 14px;border:0;
  text-align:left;cursor:pointer;color:var(--bg);background:var(--blk);opacity:.55;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.nav button:hover{opacity:1}
.nav button[aria-current="page"]{opacity:1;box-shadow:inset 6px 0 0 var(--text)}
.nav .code{font-family:var(--font-cond);font-size:11px;font-weight:500;letter-spacing:.12em;display:block;line-height:1}
.nav .lbl{font-family:var(--font-cond);font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1;margin-top:3px}
.nav .badge{font-family:var(--font-cond);font-size:14px;font-weight:600;min-width:22px;text-align:center;padding:1px 6px;background:var(--bg);color:var(--blk)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.store-note{font-size:11px;color:var(--n500);line-height:1.4;padding:0 6px}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px 0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;background:var(--n800);
  box-shadow:0 0 0 1px var(--hud),0 0 0 4px var(--bg),0 0 0 5px color-mix(in srgb,var(--hud) 35%,transparent)}
.me-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.me-txt b{font-size:13px;font-weight:500}
.me-txt small{font-size:11px;color:var(--n400);display:flex;align-items:center;gap:6px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* — main — */
main{flex:1;min-width:0;padding-block:20px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:var(--gap);position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumb{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-family:var(--font-cond);font-weight:500;color:var(--n400);display:flex;gap:8px;white-space:nowrap}
.crumb .deck{color:color-mix(in srgb,var(--hud) 55%,var(--n100))}
.crumb .pc{color:var(--amber2)}
.status{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:10.5px;letter-spacing:.16em;color:var(--n400);font-variant-numeric:tabular-nums;white-space:nowrap;flex-wrap:wrap}
.strip{display:flex;gap:4px;height:8px}
.strip span:nth-child(1){flex:3;background:var(--amber2)}
.strip span:nth-child(2){flex:1;background:var(--peach)}
.strip span:nth-child(3){flex:7;background:var(--lilac);opacity:.55}
.strip span:nth-child(4){flex:1.2;background:var(--hud)}
.strip span:nth-child(5){width:48px;background:var(--sky)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:6px}
.head>div{flex:1;min-width:min(280px,100%)}
h1{font-family:var(--font-cond);font-size:42px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1;margin:0 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--n400);font-size:14px;max-width:68ch}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--hud);background:transparent;border:1px solid var(--hud);
  border-radius:3px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--hud) 14%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--hud) 35%,transparent)}
.btn.sm{font-size:12px;padding:4px 10px}
.btn.quiet{color:var(--n300);border-color:var(--n700)}
.btn.quiet:hover{color:var(--hud);border-color:var(--hud);box-shadow:none}

/* — alert tiles — */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:var(--gap)}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;padding:var(--pad);border:0;border-radius:3px;color:var(--bg);background:var(--tc);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-cond);font-weight:600}
.tile .tv{font-size:42px;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--font-cond);font-weight:500}
.tile .ts{font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--bg) 82%,transparent)}

/* — panels — */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:var(--gap);align-items:start}
.panel{--panel:var(--hud);position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:var(--pad);padding-left:calc(var(--pad) + 4px);border-radius:3px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--hud) 5%,var(--surface)),color-mix(in srgb,var(--surface) 55%,var(--bg)));
  border:1px solid color-mix(in srgb,var(--hud) 18%,var(--n800))}
.panel::before{content:"";position:absolute;left:0;top:0;width:min(42%,220px);height:6px;background:var(--panel);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);pointer-events:none}
.panel::after{content:"";position:absolute;left:0;top:0;bottom:28px;width:4px;background:var(--panel);pointer-events:none}
.panel.wide{grid-column:1/-1}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:2px}
.ph .pi{color:var(--panel);font-size:16px}
.ph .pt{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--font-cond);font-weight:500;color:var(--panel)}
.ph .pcode{font-family:var(--font-cond);font-size:12px;letter-spacing:.1em;color:var(--n500)}
.ph .pr{margin-left:auto;display:flex;align-items:center;gap:8px}
.open{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--n400);background:transparent;border:0;cursor:pointer;padding:2px 4px;border-radius:4px}
.open:hover{color:var(--hud)}
.meta{font-size:11.5px;color:var(--n500)}
.empty{padding:14px 0;color:var(--n400);font-size:13px}
.notice{font-size:12.5px;color:var(--n300);padding:10px 12px;border-radius:3px;border:1px dashed color-mix(in srgb,var(--panel) 50%,var(--n700));background:color-mix(in srgb,var(--panel) 6%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.bad{border-color:color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--text) 6%,transparent);min-width:0}
.row:last-child{border-bottom:0}
.row.task{grid-template-columns:20px 3px minmax(0,1fr) auto auto}
.row.ev{grid-template-columns:96px 3px minmax(0,1fr)}
.row.mail{grid-template-columns:8px minmax(0,1fr) auto}
.row.link{grid-template-columns:minmax(0,1fr) auto}
.row.habit{grid-template-columns:minmax(0,1fr) auto 30px}
.row.goal{grid-template-columns:minmax(0,1fr) minmax(90px,160px) 44px auto}
.t1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:11.5px;color:var(--n500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-btn{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--n600);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;color:transparent;font-size:11px}
.done-btn:hover{border-color:var(--hud);color:var(--hud)}
.done-btn[aria-pressed="true"]{background:var(--hud);border-color:var(--hud);color:var(--bg)}
.row.is-done .t1{text-decoration:line-through;color:var(--n500)}
.sev-bar{width:3px;height:30px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.sev{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-cond);font-weight:500;color:var(--c);text-align:right}
.due{font-size:11.5px;white-space:nowrap;text-align:right;color:var(--n400)}
.due.late{color:var(--red)}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--n700);background:transparent;color:var(--n300);cursor:pointer;font-size:14px}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.ev-time{font-size:12px;color:var(--n400);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-bar{width:3px;height:22px;border-radius:2px;background:var(--c)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--hud);box-shadow:0 0 8px var(--hud)}
.read{width:8px;height:8px;border-radius:50%;border:1px solid var(--n700)}
.age{font-size:11px;color:var(--n400);white-space:nowrap;text-align:right}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--n800);color:var(--n200)}

/* forms */
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.add input,.add select,textarea.notes{min-height:34px;padding:6px 10px;font-size:13.5px;background:color-mix(in srgb,var(--bg) 60%,transparent);
  border:1px solid var(--n800);border-radius:3px;caret-color:var(--hud)}
.add input:focus-visible,.add select:focus-visible,textarea.notes:focus-visible{border-color:var(--hud);outline-offset:0}
.add input[type="text"],.add input[type="url"]{flex:1 1 180px;min-width:0}
.add input[type="date"],.add input[type="time"]{flex:0 0 auto}
.add select{flex:0 0 auto}
textarea.notes{width:100%;min-height:180px;resize:vertical;line-height:1.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* habits / goals */
.dots{display:flex;gap:4px}
.dots span{width:10px;height:10px;border-radius:50%;border:1px solid var(--n700)}
.dots span.on{background:var(--hud);border-color:var(--hud);box-shadow:0 0 6px color-mix(in srgb,var(--hud) 60%,transparent)}
.log-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;cursor:pointer;border:1px solid var(--n600);background:transparent;color:var(--n300)}
.log-btn[aria-pressed="true"]{background:var(--hud);border-color:var(--hud);color:var(--bg)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--n800)}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--hud)}
.pct{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--n300)}
.step{display:flex;gap:4px}
.step button{width:24px;height:24px;border-radius:4px;border:1px solid var(--n700);background:transparent;cursor:pointer;color:var(--n300);font-size:12px;display:grid;place-items:center}
.step button:hover{border-color:var(--hud);color:var(--hud)}

/* timeline */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--n400)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.cal-wrap{overflow-x:auto}
.cal{display:grid;gap:0 6px;min-width:700px}
.cal .dh{padding:0 4px 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--font-cond);font-weight:500;color:var(--n400)}
.cal .dh.today{color:var(--hud)}
.cal .allday{display:flex;flex-direction:column;gap:3px;padding:0 0 8px}
.cal .allday div{font-size:11px;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--hud) 18%,transparent);border-left:3px solid var(--hud);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .hours{position:relative}
.cal .hours div{height:44px;font-size:10.5px;color:var(--n500);font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.cal .col{position:relative;border-radius:6px;background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--text) 6%,transparent) 0 1px,transparent 1px 44px)}
.cal .now{position:absolute;left:-3px;right:0;height:1px;background:var(--red);box-shadow:0 0 8px var(--red);z-index:2}
.cal .now::before{content:"";position:absolute;left:-2px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.cal .blk{position:absolute;left:3px;right:3px;display:flex;flex-direction:column;gap:1px;padding:3px 7px;overflow:hidden;text-align:left;border-radius:6px;
  border:1px solid var(--bd);border-left-width:3px;background:var(--bgc);color:var(--text);text-decoration:none;min-height:18px}
.cal a.blk:hover{filter:brightness(1.2)}
.cal .blk b{font-size:12px;font-weight:400;line-height:1.25}
.cal .blk small{font-size:10.5px;color:var(--n400);font-variant-numeric:tabular-nums}
.k-busy{--bgc:color-mix(in srgb,var(--n700) 55%,transparent);--bd:var(--n600)}
.k-free{--bgc:color-mix(in srgb,var(--hud) 26%,transparent);--bd:var(--hud)}
.k-tent{--bgc:transparent;--bd:var(--hud);border-style:dashed!important}
.k-mine{--bgc:color-mix(in srgb,var(--green) 16%,transparent);--bd:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:3px;background:var(--surface);
  border:1px solid var(--hud);box-shadow:0 0 20px color-mix(in srgb,var(--hud) 35%,transparent);font-size:13px;z-index:60}

/* — narrow screens: rail becomes a top band — */
@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid color-mix(in srgb,var(--hud) 18%,var(--n900));background:color-mix(in srgb,var(--bg) 92%,transparent)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brand-name small,.switch-hint,.rail-foot{display:none}
  .spaces{margin-left:auto;width:190px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:2px}
  .nav button{min-height:38px;flex:none;padding:4px 18px 5px 10px}
  .nav .lbl{font-size:15px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
  h1{font-size:34px}
  .row.goal{grid-template-columns:minmax(0,1fr) 44px auto}
  .row.goal .bar{grid-column:1/-1;grid-row:2}
}
</style>

<div class="shell">
  <div class="grid-fx" aria-hidden="true"></div>
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark" data-icon="planet"></div>
      <div class="brand-name"><b>BRIDGE<span>//</span>OS</b><small>JOE H</small></div>
    </div>
    <div class="spaces" role="group" aria-label="Dashboard face">
      <button type="button" id="sp-work" data-space="work"><span data-icon="briefcase"></span>Work</button>
      <button type="button" id="sp-personal" data-space="personal"><span data-icon="house"></span>Personal</button>
    </div>
    <div class="switch-hint">Press <kbd>S</kbd> to flip faces</div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="rail-foot">
      <div class="store-note" id="storeNote"></div>
      <div class="me">
        <div class="avatar">JH</div>
        <div class="me-txt"><b>Joe H</b><small><span class="dot-live"></span><span id="onDeck">On the work deck</span></small></div>
      </div>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <div class="crumb"><span class="deck" id="crDeck">WORK DECK</span><span>/</span><span id="crPage">BRIDGE</span><span class="pc" id="crCode">01-117</span></div>

function render() {
  const sp = S.space; document.documentElement.dataset.space = sp;
  const pages = PAGES[sp]; let cur = pages.find(p => p.id === S.page[sp]); if (!cur) { cur = pages[0]; S.page[sp] = cur.id; }
  document.getElementById("sp-work").setAttribute("aria-pressed", sp === "work");
  document.getElementById("sp-personal").setAttribute("aria-pressed", sp === "personal");
  const d = S.data[sp];
  const badge = id => id === "tasks" ? d.tasks.filter(t => !t.done && (isLate(t) || t.sev === "Critical")).length
    : id === "comms" ? (sp === "work" ? unreadWork() : (S.live.gmail.status === "ok" ? S.live.gmail.items.length : 0)) : 0;
  const nav = document.getElementById("nav"); nav.replaceChildren(...pages.map((p, i) => { const b = badge(p.id);
    return h("button", { type: "button", style: `--blk:${BLOCKS[i % BLOCKS.length]}`, "aria-current": p.id === cur.id ? "page" : null, onclick: () => go(p.id) },
      h("span", null, h("span", { class: "code" }, p.code), h("span", { class: "lbl" }, p.label)), b ? h("span", { class: "badge", "aria-label": b + " need attention" }, b) : h("span")); }));
  document.getElementById("crDeck").textContent = sp === "work" ? "WORK DECK" : "PERSONAL QUARTERS";
  document.getElementById("crPage").textContent = cur.label.toUpperCase();
  document.getElementById("crCode").textContent = cur.code;
  document.getElementById("onDeck").textContent = sp === "work" ? "On the work deck" : "Off duty";
  document.getElementById("storeNote").textContent = S.storeMsg;
  // keep focus on a notes box the viewer is typing in
  const active = document.activeElement; const keepId = active && active.id && active.tagName === "TEXTAREA" ? active.id : null; const sel = keepId ? [active.selectionStart, active.selectionEnd] : null;
  const view = document.getElementById("view"); view.style.cssText = "display:flex;flex-direction:column;gap:var(--gap)";
  view.replaceChildren(...VIEWS[cur.id]());
  if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
}

/* ───────────── wiring ───────────── */
document.getElementById("sp-work").addEventListener("click", () => setSpace("work"));
document.getElementById("sp-personal").addEventListener("click", () => setSpace("personal"));
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target; if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
  if (e.key === "s" || e.key === "S") { e.preventDefault(); setSpace(S.space === "work" ? "personal" : "work"); }
});
window.addEventListener("hashchange", () => { const hsh = location.hash.slice(1); if (hsh === "work" || hsh === "personal") setSpace(hsh); });
function tick() { const n = new Date(); document.getElementById("clock").textContent = n.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); document.getElementById("stardate").textContent = stardate(); }
tick(); setInterval(tick, 30000);

const prefs = readPrefs();
const hsh = location.hash.slice(1);
S.space = (hsh === "work" || hsh === "personal") ? hsh : (prefs.space === "personal" ? "personal" : "work");
if (prefs.page) S.page = { ...S.page, ...prefs.page };
S.mcpState = "starting";
render();
initStore();
initLive();
})();
</script>
